[workspace]
include = ["once.toml"]

[modules]
paths = ["surface.star"]

[infrastructure.cache]
provider = "benchmark"

[infrastructures.benchmark]
kind = "tuist"
url = "http://127.0.0.1:18081"
account = "benchmark"
project = "benchmark-once"

[[target]]
name = "rust_cas"
kind = "surface_action"
srcs = ["inputs/rust-cas.txt"]

[target.attrs]
out = "rust-cas.bin"
bytes = 8388608
delay_ms = 40

[[target]]
name = "rust_core"
kind = "surface_action"
srcs = ["inputs/rust-core.txt"]
deps = ["rust_cas"]

[target.attrs]
out = "rust-core.bin"
bytes = 8388608
delay_ms = 40

