[workspace]
resolver = "2"
members = [
    "crates/struo",
    "crates/struo-cli",
    "crates/struo-core",
    "crates/struo-cas",
    "crates/struo-events-client",
    "crates/struo-frontend",
    "crates/struo-host-tree",
    "crates/struo-presentation",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.99.0"
license = "MIT"
repository = "https://github.com/tuist/struo"

[workspace.dependencies]
struo = { version = "0.0.0", path = "crates/struo" }
struo-core = { version = "0.0.0", path = "crates/struo-core", default-features = false }
struo-cas = { version = "0.0.0", path = "crates/struo-cas" }
struo-frontend = { version = "0.0.0", path = "crates/struo-frontend" }
struo-host-tree = { version = "0.0.0", path = "crates/struo-host-tree" }
struo-presentation = { version = "0.0.0", path = "crates/struo-presentation" }

allocative = "0.3"
anyhow = "1"
async-trait = "0.1"
aws-config = { version = "1.13", default-features = false, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-credential-types = "1.3"
bazel-remote-apis = "0.29"
base64 = "0.23"
blake3 = "1"
bytes = { version = "1", features = ["serde"] }
usage = { package = "usage-rs", version = "6.4.1" }
console = "0.16"
indicatif = "0.18"
fd-lock = "4"
futures = "0.3"
glob = "0.3"
hex = "0.4"
libc = "=0.2.189"
notify = "8.2"
object_store = { version = "0.14", default-features = false, features = ["aws", "azure", "fs", "gcp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "network"] }
starlark = "0.14.2"
toml = "1.0"
toon-rust = { package = "toon-format", version = "0.7", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tonic = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }
tree-sitter = "0.27.0"
tree-sitter-cypher = "0.2.6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "query", "rustls", "stream"] }
same-file = "1"
rusqlite = "=0.32.1"
sea-orm = { version = "1.1.20", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
schlussel = { git = "https://github.com/tuist/schlussel.git", rev = "80a7bc1fc0b68bdc2cd2379b16240ddbfbe0267b" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v7"] }
walkdir = "2"
zstd = "0.14"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
# `deny` rather than `forbid` so the C ABI layer can carve out a single
# `#[allow(unsafe_code)]` on the one module that needs it. `forbid`
# cannot be relaxed locally, which previously forced the `struo` crate to
# opt out of this whole table and silently lose every workspace lint.
# The FFI boundary is the only sanctioned exemption; grep for
# `allow(unsafe_code)` to audit it.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pragmatic carve-outs from the pedantic group: enum-variant naming and
# per-call error/panic prose aren't worth gating builds on.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Its suggested `assert_eq!(x, [] as [T; 0])` rewrite reads worse than
# `assert!(x.is_empty())` across the test suite.
assert_is_empty = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# The source-built Struo that CI uses to drive graph builds and tests. It
# only orchestrates rustc and other tools, so its own crates skip
# optimization, LTO, and single-unit codegen to compile faster, while
# dependencies such as the Starlark interpreter and hashers stay optimized.
[profile.bootstrap]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 16

[profile.bootstrap.package."*"]
opt-level = 3
