# Production values for the Struo website Helm chart.
#
# This chart assumes the cluster has cert-manager, ingress-nginx,
# external-dns, and external-secrets-operator with a 1Password
# ClusterSecretStore named `onepassword`.

nameOverride: ""
fullnameOverride: "struo"

host: struo.run

# Hosts the site used before the rename. They stay on the ingress so
# cert-manager keeps their certificate and external-dns keeps their records,
# and the app 301-redirects them to struo.run (docs.buildonce.dev to /docs).
# Leave empty while another release still claims them.
legacyHosts: []

image:
  repository: ghcr.io/tuist/struo-web
  tag: ""
  pullPolicy: IfNotPresent
  # The image is published publicly on GHCR, so no pull secret is needed.
  pullSecretName: ""

# Single replica: the site is static and runs on a single-node cluster, so
# horizontal scaling and HA are not achievable or needed right now.
replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Disabled: an HPA can't scale past a single-node cluster, and there is no
# load to autoscale for a static site.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

# Disabled: with one replica, a minAvailable of 1 would block node drains
# during CAPI rollouts instead of protecting availability.
pdb:
  enabled: false
  minAvailable: 1

service:
  port: 80
  targetPort: 4000

ingress:
  className: nginx
  # A namespaced Issuer (created by templates/dns-issuer.yaml) that can solve
  # the DNS-01 challenge for struo.run and the legacy hosts. When set, it takes precedence over
  # clusterIssuer, which the shared cluster only scopes to the tuist.dev zone.
  issuer: letsencrypt-struo
  clusterIssuer: letsencrypt-cloudflare

# Namespaced ACME issuer. Its Cloudflare token is synced from 1Password into the
# namespace and grants edit access to the struo.run and buildonce.dev zones.
dnsIssuer:
  enabled: true
  email: ops@tuist.dev
  acmeServer: https://acme-v02.api.letsencrypt.org/directory
  tokenSecretName: cloudflare-struo-token
  tokenRemoteRef: "cloudflare-struo-dns/credential"

env: {}

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

externalSecrets:
  enabled: true
  refreshInterval: 1h
  storeRef:
    name: onepassword
    kind: ClusterSecretStore
  items:
    SECRET_KEY_BASE:
      remoteRef: "struo-secret-key-base/password"
  # The image is public, so no registry pull secret is synced.
  pullSecret:
    enabled: false
    item: "struo-ghcr-pull"
    field: "notesPlain"
