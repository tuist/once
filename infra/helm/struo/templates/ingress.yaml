apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "struo.fullname" . }}
  labels:
    {{- include "struo.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.issuer }}
    cert-manager.io/issuer: {{ .Values.ingress.issuer | quote }}
    {{- else }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.host }}
        {{- range .Values.legacyHosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ include "struo.fullname" . }}-tls
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "struo.fullname" . }}
                port:
                  name: http
    {{- range .Values.legacyHosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "struo.fullname" $ }}
                port:
                  name: http
    {{- end }}
