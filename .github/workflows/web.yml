name: web

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/web.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "infra/**"
      - "once.toml"
      - "web/**"
      - "mise.toml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/web.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "infra/**"
      - "once.toml"
      - "web/**"
      - "mise.toml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: tuist-linux
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: once_site_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: web-once-bootstrap
          cache-on-failure: true
          cache-bin: false

      - name: Bootstrap Once from source
        run: mise exec -- cargo build --locked --package once-cli

      - name: Materialize locked Elixir dependency sources
        working-directory: web
        run: |
          mise exec -- mix local.hex --force
          mise exec -- mix local.rebar --force
          mise exec -- mix deps.get --check-locked

      - name: Authenticate the shared Once cache
        id: once-cache-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: target/debug/once auth login --provider tuist --no-browser

      - name: Build with Once
        run: target/debug/once build web/application_test
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-cache-auth.outcome == 'success' && 'tuist' || 'local' }}

      - name: Lint with Once
        run: target/debug/once run web/application_test
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-cache-auth.outcome == 'success' && 'tuist' || 'local' }}

      - name: Test with Once
        run: target/debug/once test web/tests
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-cache-auth.outcome == 'success' && 'tuist' || 'local' }}

  release:
    name: release
    runs-on: tuist-linux
    needs: check
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: web-once-bootstrap
          cache-on-failure: true
          cache-bin: false

      - name: Bootstrap Once from source
        run: mise exec -- cargo build --locked --package once-cli

      - name: Materialize locked Elixir dependency sources
        working-directory: web
        run: |
          mise exec -- mix local.hex --force
          mise exec -- mix local.rebar --force
          MIX_ENV=prod mise exec -- mix deps.get --check-locked
          MIX_ENV=prod mise exec -- mix esbuild.install --if-missing

      - name: Authenticate the shared Once cache
        id: once-cache-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: target/debug/once auth login --provider tuist --no-browser

      - name: Assemble the production release with Once
        run: target/debug/once build web/release
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-cache-auth.outcome == 'success' && 'tuist' || 'local' }}

  docker:
    name: docker
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./web/Dockerfile
          push: false
          platforms: linux/amd64
          tags: once-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: helm
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925
        with:
          install_args: "helm@3.21.0"
          cache: "false"

      - run: mise --no-config exec helm@3.21.0 -- helm lint infra/helm/once
      - run: mise --no-config exec helm@3.21.0 -- helm template once infra/helm/once --namespace once-production >/tmp/once-helm-rendered.yaml
      - run: mise --no-config exec helm@3.21.0 -- bash infra/helm/once/tests/render-conditionals.sh
        env:
          RENDERED_MANIFEST: /tmp/once-helm-rendered.yaml
