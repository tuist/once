name: web

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/web.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "infra/**"
      - "once.toml"
      - "web/**"
      - "mise.toml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/web.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "infra/**"
      - "once.toml"
      - "web/**"
      - "mise.toml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: tuist-linux
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925
        with:
          # Pinned so mise-action does not follow the upstream "latest"
          # pointer into a release whose assets have not been published
          # yet (v2026.9.3's tarball 404s at the time of writing).
          version: "2026.10.2"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev libasound2-dev

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: web-once-bootstrap
          cache-on-failure: true
          cache-bin: false

      - name: Bootstrap Once from source
        run: mise exec -- cargo build --locked --package once-cli

      - name: Materialize locked Elixir dependency sources
        working-directory: web
        run: |
          mise exec -- mix local.hex --force
          mise exec -- mix local.rebar --force
          mise exec -- mix deps.get --check-locked

      - name: Authenticate the shared Once cache
        id: once-cache-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: target/debug/once auth login --provider tuist --no-browser

      - name: Build with Once
        run: target/debug/once build web/application_test
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-cache-auth.outcome == 'success' && 'tuist-web' || 'local' }}

      - name: Lint with Once
        run: target/debug/once run web/application_test
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-cache-auth.outcome == 'success' && 'tuist-web' || 'local' }}

      - name: Test with Once
        id: graph-tests
        run: target/debug/once test web/tests
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-cache-auth.outcome == 'success' && 'tuist-web' || 'local' }}

      - name: Surface native test logs on failure
        if: failure() && steps.graph-tests.outcome == 'failure'
        run: |
          find .once/out/web/tests/test -type f -name '*.log' -print0 |
            while IFS= read -r -d '' log; do
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
            done

      - name: Preserve failing test diagnostics
        if: failure() && steps.graph-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: web-test-diagnostics
          include-hidden-files: true
          path: |
            .once/out/web/tests/test/
            ~/.local/state/once/logs/

  release:
    name: release
    runs-on: tuist-linux
    needs: check
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925
        with:
          # Pinned so mise-action does not follow the upstream "latest"
          # pointer into a release whose assets have not been published
          # yet (v2026.9.3's tarball 404s at the time of writing).
          version: "2026.10.2"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev libasound2-dev

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: web-once-bootstrap
          cache-on-failure: true
          cache-bin: false

      - name: Bootstrap Once from source
        run: mise exec -- cargo build --locked --package once-cli

      - name: Materialize locked Elixir dependency sources
        working-directory: web
        run: |
          mise exec -- mix local.hex --force
          mise exec -- mix local.rebar --force
          MIX_ENV=prod mise exec -- mix deps.get --check-locked
          MIX_ENV=prod mise exec -- mix esbuild.install --if-missing

      - name: Authenticate the shared Once cache
        id: once-cache-auth
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: target/debug/once auth login --provider tuist --no-browser

      - name: Assemble the production release with Once
        run: target/debug/once build web/release
        env:
          ONCE_CACHE_PROVIDER: ${{ steps.once-cache-auth.outcome == 'success' && 'tuist-web' || 'local' }}

      - name: Surface mix release logs on failure
        if: failure()
        working-directory: web
        run: |
          for log in $(find ../.once -name 'mix-release*.log' 2>/dev/null); do
            echo "::group::$log"
            cat "$log" || true
            echo "::endgroup::"
          done

  docker:
    name: docker
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./web/Dockerfile
          push: false
          platforms: linux/amd64
          tags: once-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: helm
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925
        with:
          # Pinned so mise-action does not follow the upstream "latest"
          # pointer into a release whose assets have not been published
          # yet (v2026.9.3's tarball 404s at the time of writing).
          version: "2026.10.2"
          install_args: "helm@3.21.0"
          cache: "false"

      - run: mise --no-config exec helm@3.21.0 -- helm lint infra/helm/once
      - run: mise --no-config exec helm@3.21.0 -- helm template once infra/helm/once --namespace once-production >/tmp/once-helm-rendered.yaml
      - run: mise --no-config exec helm@3.21.0 -- bash infra/helm/once/tests/render-conditionals.sh
        env:
          RENDERED_MANIFEST: /tmp/once-helm-rendered.yaml
