name: bench

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'benchmarks/**'
      - 'mise.toml'
      - '.github/workflows/bench.yml'
  push:
    branches: [main]

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  warm-loop:
    name: warm-loop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [tuist-linux-large, tuist-macos]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          # Pinned so the workflow does not follow `mise-action`'s
          # "latest" pointer into a release whose assets have not been
          # published yet (v2026.9.3's linux-x64 tarball 404s at the
          # time of writing and takes down every downstream job).
          version: "2026.11.9"
          experimental: true
          cache: true
          # GitHub-hosted runners share the default key, and their cached
          # pipx tools link to interpreters that Tuist runners lack.
          cache_key_prefix: mise-v1-tuist
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
          cache-on-failure: true
          cache-bin: false
      - name: build struo
        run: mise exec -- cargo build --release --package struo-cli
      - name: trust bench fixture mise configs
        # The bench fixture and the repo root both ship a `mise.toml`.
        # Struo runs each fixture action through a sandboxed mise subprocess
        # that does not inherit the workflow's `MISE_TRUSTED_CONFIG_PATHS`,
        # so trust has to be persisted to disk before the timed run starts.
        run: |
          mise trust --yes mise.toml
          mise trust --yes benchmarks/cache-comparison/struo/mise.toml
      - name: warm-loop bench
        run: benchmarks/warm-loop/run.sh
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: warm-loop-${{ matrix.os }}
          path: benchmarks/warm-loop/results/
          if-no-files-found: warn
