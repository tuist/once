[package]
name = "once-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "once"
path = "src/main.rs"

[dependencies]
once-cas.workspace = true
once-core = { workspace = true, features = ["remote-microsandbox"] }
once-events-client = { version = "0.0.0", path = "../once-events-client" }
once-frontend.workspace = true

anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
hex = "0.4"
usage.workspace = true
console.workspace = true
indicatif.workspace = true
fd-lock.workspace = true
glob.workspace = true
futures.workspace = true
notify.workspace = true
reqwest.workspace = true
rodio = { version = "0.20", default-features = false }
serde.workspace = true
serde_json.workspace = true
sysinfo = { workspace = true }
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
toon-rust.workspace = true
tokio.workspace = true
tonic.workspace = true
tree-sitter.workspace = true
tree-sitter-cypher.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
walkdir.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
anstyle-query = "1.1"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.30", features = ["term", "signal"] }
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
