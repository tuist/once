[package]
name = "once-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "once"
path = "src/main.rs"

[features]
default = ["events-ingest"]
# Wire the RFC 0008 live event ingest client. Enabled by default in
# both the Once graph release build (via
# `crates/once-cli/once.toml`) and cargo builds so `once` reports the
# run it just ran to whichever server it authenticated against.
# Self-hosted builds that do not want the ingest client can turn the
# feature off; the runtime already degrades to a no-op reporter when
# no events endpoint is configured, so the runtime cost of leaving it
# on is bounded to the client crate compiling.
events-ingest = ["dep:once-events-client", "dep:tonic"]

[dependencies]
once-cas.workspace = true
once-core = { workspace = true, features = ["remote-microsandbox"] }
once-events-client = { version = "0.0.0", path = "../once-events-client", optional = true }
once-frontend.workspace = true

anyhow.workspace = true
axum.workspace = true
blake3.workspace = true
hex = "0.4"
usage.workspace = true
console.workspace = true
indicatif.workspace = true
fd-lock.workspace = true
glob.workspace = true
futures.workspace = true
notify.workspace = true
reqwest.workspace = true
rodio = { version = "0.20", default-features = false }
serde.workspace = true
serde_json.workspace = true
sysinfo = { workspace = true }
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
toon-rust.workspace = true
tokio.workspace = true
tonic = { workspace = true, optional = true }
tree-sitter.workspace = true
tree-sitter-cypher.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
walkdir.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
