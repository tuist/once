[package]
name = "once-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "once"
path = "src/main.rs"

[features]
default = ["events-ingest"]
# Wire the RFC 0008 live event ingest client. Off in the Once graph
# release build so that self-hosted builds do not need the extra
# crate; on by default for cargo builds.
events-ingest = ["dep:once-events-client", "dep:tonic"]

[dependencies]
once-cas.workspace = true
once-core = { workspace = true, features = ["remote-microsandbox"] }
once-events-client = { version = "0.0.0", path = "../once-events-client", optional = true }
once-frontend.workspace = true

anyhow.workspace = true
axum.workspace = true
blake3.workspace = true
usage.workspace = true
console.workspace = true
fd-lock.workspace = true
glob.workspace = true
futures.workspace = true
notify.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
toon-rust.workspace = true
tokio.workspace = true
tonic = { workspace = true, optional = true }
tree-sitter.workspace = true
tree-sitter-cypher.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
walkdir.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
