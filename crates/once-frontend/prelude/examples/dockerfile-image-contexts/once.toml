[[target]]
name = "alpine"
kind = "oci_pull"

[target.attrs]
image = "docker.io/library/alpine"
digest = "sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659"

[[target]]
name = "hello"
kind = "go_binary"
srcs = ["main.go"]

[target.attrs]
goos = "linux"
cgo = false
strip = true

[[target]]
name = "hello_image"
kind = "dockerfile_image"

[target.dependencies]
images = ["alpine"]
programs = ["hello"]

[target.attrs]
dockerfile = "docker/Dockerfile"
context = "docker"
tag = "once-dockerfile-contexts:latest"
pull = false
context_names = { alpine = "alpine:3.23" }
