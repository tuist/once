# The Xcode native project resolver emits an `xcode_spm_dependencies` target
# automatically for every Xcode project that consumes Swift packages: it builds
# those package products once and shares the resulting archive, Swift modules,
# Objective-C module maps, and frameworks with the project's native targets.
# This starter shows that synthesized target on its own, aggregating a single
# workspace-local package so the shape is easy to follow.
[[target]]
name = "OnceSwiftPackages"
kind = "xcode_spm_dependencies"

[target.attrs]
manifest = """// swift-tools-version:5.9
import PackageDescription

let package = Package(
    name: "OnceXcodeDeps",
    platforms: [.macOS(.v13)],
    products: [
        .library(name: "OnceXcodeDeps", type: .static, targets: ["OnceXcodeDeps"]),
    ],
    dependencies: [
        .package(path: "Vendor/Greeting"),
    ],
    targets: [
        .target(
            name: "OnceXcodeDeps",
            dependencies: [
                .product(name: "Greeting", package: "greeting"),
            ]
        ),
    ]
)
"""
platform = "macos"
minimum_os = "13.0"
