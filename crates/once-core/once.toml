[[target]]
name = "once_core"
kind = "rust_library"
deps = [
  "crates/once-presentation/once_presentation",
  "crates/once-cas/once_cas",
  "crates/once-host-tree/once_host_tree",
  "cargo_dependencies",
]
srcs = ["src/**/*.rs"]

[target.attrs]
crate_name = "once_core"
crate_root = "src/lib.rs"
edition = "2021"
features = ["default", "remote-microsandbox"]

[target.attrs.rustc_env]
CARGO_MANIFEST_DIR = "crates/once-core"
CARGO_PKG_NAME = "once-core"
CARGO_PKG_VERSION = "0.0.0"

# Tests

[[target]]
name = "once_core_unit_tests"
kind = "rust_test"
deps = [
  "crates/once-presentation/once_presentation",
  "crates/once-cas/once_cas",
  "crates/once-host-tree/once_host_tree",
  "cargo_dependencies",
]
srcs = ["src/**/*.rs"]

[target.attrs]
crate_name = "once_core"
crate_root = "src/lib.rs"
edition = "2021"
cargo_package = "once-core"
features = [
  "default",
  "remote-microsandbox",
]

[target.attrs.rustc_env]
CARGO_MANIFEST_DIR = "crates/once-core"
CARGO_PKG_NAME = "once-core"
CARGO_PKG_VERSION = "0.0.0"

[[target]]
name = "runner_tests"
kind = "rust_test"
deps = [
  "crates/once-core/once_core",
  "crates/once-cas/once_cas",
  "crates/once-host-tree/once_host_tree",
  "cargo_dependencies",
]
srcs = ["tests/runner.rs"]

[target.attrs]
crate_name = "runner"
crate_root = "tests/runner.rs"
edition = "2021"
cargo_package = "once-core"

[target.attrs.rustc_env]
CARGO_MANIFEST_DIR = "crates/once-core"
CARGO_PKG_NAME = "once-core"
CARGO_PKG_VERSION = "0.0.0"
